name: Masroufi
options:
  bundleIdPrefix: com.mustafa
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Masroufi:
    type: application
    platform: iOS
    sources:
      - path: Masroufi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustafa.masroufi
        PRODUCT_NAME: Masroufi
        INFOPLIST_KEY_CFBundleDisplayName: masroifi
        INFOPLIST_KEY_NSFaceIDUsageDescription: يستخدم مصروفي Face ID لحماية بياناتك المالية.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
